<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t d"><title id="t">Antes e depois do fluxo Edits para Stories</title><desc id="d">Comparativo visual entre o fluxo com exportação para galeria e o fluxo com compartilhamento direto do Edits para Stories.</desc><rect width="1600" height="900" fill="#e7e2da"/><text x="120" y="125" fill="#1a1c1e" font-family="Arial,sans-serif" font-size="46" font-weight="700">O QUE MUDA NO FLUXO DE PRODUÇÃO</text><text x="120" y="174" fill="#625f5b" font-family="Arial,sans-serif" font-size="22">A vantagem confirmável está na redução de etapas — não em promessas automáticas de alcance ou qualidade.</text><g font-family="Arial,sans-serif"><rect x="120" y="250" width="640" height="500" rx="24" fill="#f1ede6" stroke="#c8c1b8"/><text x="170" y="315" fill="#8a5b47" font-size="20" font-weight="700">ANTES</text><text x="170" y="370" fill="#1a1c1e" font-size="34" font-weight="700">Editor → galeria → Instagram</text><g fill="#625f5b" font-size="22"><text x="190" y="455">1. Finalizar a edição</text><text x="190" y="515">2. Exportar para o dispositivo</text><text x="190" y="575">3. Abrir o Instagram</text><text x="190" y="635">4. Selecionar o arquivo</text><text x="190" y="695">5. Publicar no Story</text></g><rect x="840" y="250" width="640" height="500" rx="24" fill="#0f3d4a"/><text x="890" y="315" fill="#d28b68" font-size="20" font-weight="700">COM O ENVIO DIRETO</text><text x="890" y="370" fill="#f1ede6" font-size="34" font-weight="700">Edits → Instagram Stories</text><g fill="#e1ddd6" font-size="22"><text x="910" y="470">1. Finalizar a edição</text><text x="910" y="540">2. Escolher Stories no compartilhamento</text><text x="910" y="610">3. Revisar e publicar</text></g><text x="890" y="690" fill="#d28b68" font-size="20" font-weight="700">MENOS TROCAS DE CONTEXTO. MAIS FLUIDEZ.</text></g></svg>