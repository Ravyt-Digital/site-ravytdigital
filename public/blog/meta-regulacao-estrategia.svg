<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t d"><title id="t">Regulação como parte da estratégia da Meta</title><desc id="d">Infográfico da Ravyt Digital mostrando como regulação influencia aquisições, design de produto e governança da Meta.</desc><rect width="1600" height="900" fill="#e7e2da"/><rect x="90" y="90" width="1420" height="720" rx="28" fill="#121416"/><text x="160" y="175" fill="#f1ede6" font-family="Arial,sans-serif" font-size="42" font-weight="700">REGULAÇÃO DEIXOU DE SER UM TEMA JURÍDICO ISOLADO</text><text x="160" y="225" fill="#aaa39b" font-family="Arial,sans-serif" font-size="22">Ela já interfere diretamente em aquisição, produto, dados, segurança e distribuição.</text><g font-family="Arial,sans-serif"><rect x="160" y="335" width="330" height="250" rx="20" fill="#23272a"/><text x="200" y="390" fill="#d28b68" font-size="20" font-weight="700">M&amp;A TRANSFRONTEIRIÇO</text><text x="200" y="455" fill="#f1ede6" font-size="33" font-weight="700">Manus</text><text x="200" y="500" fill="#f1ede6" font-size="33" font-weight="700">→ reversão</text><text x="200" y="548" fill="#aaa39b" font-size="18">Tecnologia crítica passa</text><text x="200" y="573" fill="#aaa39b" font-size="18">pela geopolítica.</text><rect x="635" y="335" width="330" height="250" rx="20" fill="#0f3d4a"/><text x="675" y="390" fill="#d28b68" font-size="20" font-weight="700">SEGURANÇA DE JOVENS</text><text x="675" y="455" fill="#f1ede6" font-size="33" font-weight="700">Design</text><text x="675" y="500" fill="#f1ede6" font-size="33" font-weight="700">→ responsabilidade</text><text x="675" y="548" fill="#d7d1c8" font-size="18">Litígios questionam</text><text x="675" y="573" fill="#d7d1c8" font-size="18">como plataformas operam.</text><rect x="1110" y="335" width="330" height="250" rx="20" fill="#23272a"/><text x="1150" y="390" fill="#d28b68" font-size="20" font-weight="700">IDADE E DADOS</text><text x="1150" y="455" fill="#f1ede6" font-size="33" font-weight="700">IA</text><text x="1150" y="500" fill="#f1ede6" font-size="33" font-weight="700">→ proteção</text><text x="1150" y="548" fill="#aaa39b" font-size="18">Age assurance muda</text><text x="1150" y="573" fill="#aaa39b" font-size="18">a experiência por faixa etária.</text></g><path d="M490 460H620" stroke="#b86e4a" stroke-width="7"/><path d="M965 460H1095" stroke="#b86e4a" stroke-width="7"/><text x="160" y="730" fill="#8f8880" font-family="Arial,sans-serif" font-size="17">RAVYT DIGITAL · REGULAÇÃO + PRODUTO + ESTRATÉGIA</text></svg>