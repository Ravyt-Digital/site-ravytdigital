<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t d"><title id="t">E-E-A-T na prática: quem, como e por quê</title><desc id="d">Infográfico da Ravyt Digital sobre autoria, processo editorial e intenção de ajudar o leitor.</desc><rect width="1600" height="900" fill="#e7e2da"/><text x="120" y="150" fill="#0f3d4a" font-family="Arial,sans-serif" font-size="52" font-weight="700">E-E-A-T NA PRÁTICA</text><text x="120" y="205" fill="#625f5b" font-family="Arial,sans-serif" font-size="24">Confiança começa quando o leitor entende quem produziu, como produziu e por que aquele conteúdo existe.</text><g font-family="Arial,sans-serif"><rect x="120" y="300" width="400" height="390" rx="28" fill="#1a1c1e"/><circle cx="190" cy="380" r="34" fill="#b86e4a"/><text x="178" y="392" fill="#fff" font-size="31" font-weight="700">1</text><text x="245" y="390" fill="#f4f0e8" font-size="34" font-weight="700">QUEM</text><text x="160" y="470" fill="#d8d2c9" font-size="23">Autoria identificável</text><text x="160" y="515" fill="#d8d2c9" font-size="23">Experiência relevante</text><text x="160" y="560" fill="#d8d2c9" font-size="23">Perfil ou credenciais</text><text x="160" y="630" fill="#b86e4a" font-size="19" font-weight="700">→ Torna a fonte verificável</text><rect x="600" y="300" width="400" height="390" rx="28" fill="#0f3d4a"/><circle cx="670" cy="380" r="34" fill="#d28b68"/><text x="658" y="392" fill="#fff" font-size="31" font-weight="700">2</text><text x="725" y="390" fill="#fff" font-size="34" font-weight="700">COMO</text><text x="640" y="470" fill="#e7e2da" font-size="23">Método explicado</text><text x="640" y="515" fill="#e7e2da" font-size="23">Fontes e critérios</text><text x="640" y="560" fill="#e7e2da" font-size="23">Uso de IA, se relevante</text><text x="640" y="630" fill="#d28b68" font-size="19" font-weight="700">→ Mostra como a conclusão surgiu</text><rect x="1080" y="300" width="400" height="390" rx="28" fill="#f1ede6" stroke="#b8b1a8" stroke-width="2"/><circle cx="1150" cy="380" r="34" fill="#0f3d4a"/><text x="1138" y="392" fill="#fff" font-size="31" font-weight="700">3</text><text x="1205" y="390" fill="#1a1c1e" font-size="34" font-weight="700">POR QUÊ</text><text x="1120" y="470" fill="#625f5b" font-size="23">Resolver uma dúvida real</text><text x="1120" y="515" fill="#625f5b" font-size="23">Ajudar uma decisão</text><text x="1120" y="560" fill="#625f5b" font-size="23">Não manipular rankings</text><text x="1120" y="630" fill="#0f3d4a" font-size="19" font-weight="700">→ Coloca pessoas em primeiro lugar</text></g><text x="120" y="790" fill="#8f8880" font-family="Arial,sans-serif" font-size="18">RAVYT DIGITAL · GOVERNANÇA EDITORIAL</text></svg>