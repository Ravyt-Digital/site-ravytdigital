<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t d"><title id="t">Meta em 2026: IA, infraestrutura e regulação</title><desc id="d">Ilustração editorial da Ravyt Digital mostrando três vetores estratégicos da Meta: inteligência artificial, infraestrutura computacional e pressão regulatória.</desc><rect width="1600" height="900" fill="#e7e2da"/><rect x="64" y="64" width="1472" height="772" rx="34" fill="#121416"/><g opacity=".16" stroke="#d28b68"><path d="M64 210H1536"/><path d="M64 360H1536"/><path d="M64 510H1536"/><path d="M64 660H1536"/><path d="M300 64V836"/><path d="M600 64V836"/><path d="M900 64V836"/><path d="M1200 64V836"/></g><circle cx="800" cy="440" r="142" fill="#0f3d4a" stroke="#d28b68" stroke-width="4"/><text x="800" y="425" text-anchor="middle" fill="#f1ede6" font-family="Arial,sans-serif" font-size="54" font-weight="700">META</text><text x="800" y="475" text-anchor="middle" fill="#d28b68" font-family="Arial,sans-serif" font-size="22" font-weight="700">ESTRATÉGIA 2026</text><g font-family="Arial,sans-serif"><rect x="150" y="245" width="360" height="260" rx="24" fill="#1a1c1e" stroke="#314147"/><text x="190" y="300" fill="#d28b68" font-size="20" font-weight="700">01 — INTELIGÊNCIA ARTIFICIAL</text><text x="190" y="370" fill="#f1ede6" font-size="36" font-weight="700">Modelos + agentes</text><text x="190" y="420" fill="#f1ede6" font-size="36" font-weight="700">+ produtos</text><text x="190" y="468" fill="#aaa39b" font-size="19">Meta AI evolui de resposta</text><text x="190" y="495" fill="#aaa39b" font-size="19">para execução de tarefas.</text><rect x="1090" y="245" width="360" height="260" rx="24" fill="#1a1c1e" stroke="#314147"/><text x="1130" y="300" fill="#d28b68" font-size="20" font-weight="700">02 — INFRAESTRUTURA</text><text x="1130" y="370" fill="#f1ede6" font-size="36" font-weight="700">Compute em escala</text><text x="1130" y="420" fill="#f1ede6" font-size="36" font-weight="700">+ capital</text><text x="1130" y="468" fill="#aaa39b" font-size="19">Data centers viram parte</text><text x="1130" y="495" fill="#aaa39b" font-size="19">do produto de IA.</text><rect x="620" y="625" width="360" height="145" rx="24" fill="#1a1c1e" stroke="#314147"/><text x="660" y="680" fill="#d28b68" font-size="20" font-weight="700">03 — REGULAÇÃO</text><text x="660" y="730" fill="#f1ede6" font-size="30" font-weight="700">Mercado, jovens e jurisdição</text></g><path d="M510 375C620 375 635 405 665 420" fill="none" stroke="#b86e4a" stroke-width="7"/><path d="M1090 375C980 375 965 405 935 420" fill="none" stroke="#b86e4a" stroke-width="7"/><path d="M800 582V625" stroke="#b86e4a" stroke-width="7"/><text x="150" y="760" fill="#8f8880" font-family="Arial,sans-serif" font-size="17">RAVYT DIGITAL · ANÁLISE ESTRATÉGICA</text></svg>