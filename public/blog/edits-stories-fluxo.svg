<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Fluxo direto do Edits para Instagram Stories</title><desc id="desc">Diagrama da Ravyt Digital mostrando a passagem de roteiro e gravação para edição no Edits e publicação no Instagram Stories.</desc><rect width="1600" height="900" fill="#e7e2da"/><rect x="90" y="90" width="1420" height="720" rx="26" fill="#1a1c1e"/><text x="160" y="185" fill="#f1ede6" font-family="Arial,sans-serif" font-size="44" font-weight="700">EDITS → STORIES: MENOS ETAPAS ENTRE EDIÇÃO E PUBLICAÇÃO</text><text x="160" y="235" fill="#bcb6ae" font-family="Arial,sans-serif" font-size="22">A principal mudança é operacional: o projeto finalizado pode seguir direto para a superfície de Stories.</text><g font-family="Arial,sans-serif"><rect x="160" y="340" width="310" height="260" rx="18" fill="#23272a" stroke="#3b4145"/><text x="200" y="400" fill="#d28b68" font-size="20" font-weight="700">01 — CRIAR</text><text x="200" y="468" fill="#f1ede6" font-size="34" font-weight="700">Roteiro</text><text x="200" y="512" fill="#f1ede6" font-size="34" font-weight="700">+ gravação</text><text x="200" y="565" fill="#a9a39c" font-size="19">Ideia, teleponto e clipes.</text><path d="M500 470H610" stroke="#b86e4a" stroke-width="7"/><path d="M595 450l24 20-24 20" fill="none" stroke="#b86e4a" stroke-width="7"/><rect x="640" y="340" width="320" height="260" rx="18" fill="#0f3d4a"/><text x="680" y="400" fill="#d28b68" font-size="20" font-weight="700">02 — EDITAR</text><text x="680" y="468" fill="#f1ede6" font-size="34" font-weight="700">Timeline</text><text x="680" y="512" fill="#f1ede6" font-size="34" font-weight="700">+ legendas</text><text x="680" y="565" fill="#d5d0c8" font-size="19">Edits como workspace móvel.</text><path d="M990 470H1100" stroke="#b86e4a" stroke-width="7"/><path d="M1085 450l24 20-24 20" fill="none" stroke="#b86e4a" stroke-width="7"/><rect x="1130" y="340" width="310" height="260" rx="18" fill="#23272a" stroke="#3b4145"/><text x="1170" y="400" fill="#d28b68" font-size="20" font-weight="700">03 — DISTRIBUIR</text><text x="1170" y="468" fill="#f1ede6" font-size="34" font-weight="700">Instagram</text><text x="1170" y="512" fill="#f1ede6" font-size="34" font-weight="700">Stories</text><text x="1170" y="565" fill="#a9a39c" font-size="19">Menos ida e volta entre apps.</text></g><text x="160" y="710" fill="#8e8881" font-family="Arial,sans-serif" font-size="18">RAVYT DIGITAL · SOCIAL MEDIA + VIBE CODING</text></svg>