<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
  <title id="title">Edits para Stories: menos etapas entre edição e publicação</title>
  <desc id="desc">Arte editorial quadrada da Ravyt Digital mostrando um fluxo em três etapas: criar, editar no Edits e publicar nos Instagram Stories.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#121416"/>
      <stop offset="1" stop-color="#1b2023"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f3d4a"/>
      <stop offset="1" stop-color="#12313a"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#ffffff" stroke-opacity=".035"/>
    </pattern>
  </defs>

  <rect width="1200" height="1200" fill="url(#bg)"/>
  <rect width="1200" height="1200" fill="url(#grid)"/>
  <path d="M0 145C135 145 145 0 145 0" fill="none" stroke="#0f7d89" stroke-opacity=".55" stroke-width="2"/>
  <path d="M1200 1055C1065 1055 1055 1200 1055 1200" fill="none" stroke="#b86e4a" stroke-opacity=".55" stroke-width="2"/>

  <text x="86" y="108" fill="#d28b68" font-family="Arial,sans-serif" font-size="20" font-weight="700" letter-spacing="4">RAVYT DIGITAL · SOCIAL MEDIA</text>
  <text x="86" y="218" fill="#f1ede6" font-family="Arial,sans-serif" font-size="78" font-weight="800">EDITS → STORIES</text>
  <text x="86" y="274" fill="#c9c3bb" font-family="Arial,sans-serif" font-size="28">Menos etapas entre edição e publicação.</text>

  <g font-family="Arial,sans-serif">
    <rect x="86" y="370" width="292" height="510" rx="28" fill="#202529" stroke="#596065" stroke-opacity=".55"/>
    <text x="126" y="432" fill="#d28b68" font-size="22" font-weight="700">01 — CRIAR</text>
    <rect x="126" y="500" width="212" height="174" rx="18" fill="#171a1d" stroke="#4a5054"/>
    <rect x="148" y="524" width="78" height="78" rx="10" fill="none" stroke="#727a80" stroke-dasharray="10 9"/>
    <path d="M187 544V582M168 563H206" stroke="#d28b68" stroke-width="7" stroke-linecap="round"/>
    <rect x="244" y="526" width="70" height="13" rx="5" fill="#343a3e"/>
    <rect x="244" y="553" width="70" height="13" rx="5" fill="#343a3e"/>
    <rect x="244" y="580" width="50" height="13" rx="5" fill="#343a3e"/>
    <text x="126" y="742" fill="#f1ede6" font-size="34" font-weight="700">Clipes + roteiro</text>
    <text x="126" y="786" fill="#aba59e" font-size="21">Organize a ideia e grave.</text>

    <path d="M399 625H457" stroke="#b86e4a" stroke-width="7" stroke-linecap="round"/>
    <path d="M443 605L465 625L443 645" fill="none" stroke="#b86e4a" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="486" y="338" width="322" height="574" rx="30" fill="url(#panel)" stroke="#19a0ad" stroke-opacity=".75"/>
    <text x="526" y="432" fill="#d28b68" font-size="22" font-weight="700">02 — EDITAR</text>
    <rect x="526" y="500" width="242" height="182" rx="18" fill="#171a1d" stroke="#42565d"/>
    <rect x="548" y="528" width="44" height="30" rx="7" fill="#2a3034"/>
    <path d="M566 535L582 543L566 551Z" fill="#d5d0c8"/>
    <rect x="548" y="583" width="198" height="23" rx="7" fill="#252a2e"/>
    <rect x="577" y="583" width="42" height="23" rx="7" fill="#0f5662"/>
    <rect x="628" y="583" width="52" height="23" rx="7" fill="#196b74"/>
    <rect x="690" y="583" width="34" height="23" rx="7" fill="#0f5662"/>
    <rect x="548" y="621" width="198" height="15" rx="6" fill="#30363a"/>
    <path d="M651 506V654" stroke="#f1ede6" stroke-width="3"/>
    <circle cx="651" cy="506" r="6" fill="#f1ede6"/>
    <text x="526" y="752" fill="#f1ede6" font-size="40" font-weight="700">Timeline</text>
    <text x="526" y="797" fill="#f1ede6" font-size="40" font-weight="700">+ legendas</text>
    <text x="526" y="848" fill="#8fd0d5" font-size="21">Finalize tudo no Edits.</text>

    <path d="M829 625H887" stroke="#b86e4a" stroke-width="7" stroke-linecap="round"/>
    <path d="M873 605L895 625L873 645" fill="none" stroke="#b86e4a" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="916" y="370" width="198" height="510" rx="28" fill="#202529" stroke="#596065" stroke-opacity=".55"/>
    <text x="951" y="432" fill="#d28b68" font-size="22" font-weight="700">03 — STORIES</text>
    <rect x="959" y="504" width="112" height="184" rx="24" fill="#171a1d" stroke="#62696d" stroke-width="4"/>
    <rect x="976" y="529" width="78" height="120" rx="14" fill="none" stroke="#4e5559" stroke-dasharray="8 8"/>
    <circle cx="1015" cy="589" r="36" fill="none" stroke="#3f464a"/>
    <path d="M1015 614V563M1015 563L993 586M1015 563L1037 586" fill="none" stroke="#d28b68" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="951" y="748" fill="#f1ede6" font-size="31" font-weight="700">Publicar</text>
    <text x="951" y="786" fill="#f1ede6" font-size="31" font-weight="700">nos Stories</text>
    <text x="951" y="835" fill="#aba59e" font-size="19">Menos ida e volta.</text>
  </g>

  <line x1="86" y1="1000" x2="1114" y2="1000" stroke="#ffffff" stroke-opacity=".1"/>
  <text x="86" y="1060" fill="#d28b68" font-family="Arial,sans-serif" font-size="18" font-weight="700" letter-spacing="2">O QUE MUDA NA PRÁTICA</text>
  <text x="86" y="1105" fill="#c8c2ba" font-family="Arial,sans-serif" font-size="22">O projeto finalizado pode seguir direto para a superfície de Stories.</text>
</svg>