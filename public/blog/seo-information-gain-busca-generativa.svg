<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t d"><title id="t">Da busca tradicional à busca generativa</title><desc id="d">Diagrama editorial da Ravyt Digital mostrando a evolução de palavras-chave para informação útil e respostas generativas.</desc><rect width="1600" height="900" fill="#d8d1c7"/><rect x="110" y="110" width="1380" height="680" rx="34" fill="#171717"/><text x="180" y="205" fill="#f4f0e8" font-family="Arial,sans-serif" font-size="42" font-weight="700">DA BUSCA TRADICIONAL À BUSCA GENERATIVA</text><text x="180" y="260" fill="#c8c1b7" font-family="Arial,sans-serif" font-size="23">O conteúdo precisa ser útil para pessoas e compreensível para sistemas de busca e IA.</text><g font-family="Arial,sans-serif"><rect x="180" y="350" width="330" height="250" rx="24" fill="#282828"/><text x="220" y="410" fill="#b88cff" font-size="22" font-weight="700">01 — SEO clássico</text><text x="220" y="475" fill="#f4f0e8" font-size="30" font-weight="700">Palavra-chave</text><text x="220" y="520" fill="#f4f0e8" font-size="30" font-weight="700">+ intenção</text><text x="220" y="565" fill="#bcb6ae" font-size="20">Encontrar e responder.</text><path d="M535 475H650" stroke="#d8ff5f" stroke-width="8"/><path d="M635 455L660 475L635 495" fill="none" stroke="#d8ff5f" stroke-width="8"/><rect x="680" y="350" width="330" height="250" rx="24" fill="#282828"/><text x="720" y="410" fill="#d8ff5f" font-size="22" font-weight="700">02 — Ganho de informação</text><text x="720" y="475" fill="#f4f0e8" font-size="30" font-weight="700">Valor novo</text><text x="720" y="520" fill="#f4f0e8" font-size="30" font-weight="700">+ evidência</text><text x="720" y="565" fill="#bcb6ae" font-size="20">Acrescentar, não copiar.</text><path d="M1035 475H1150" stroke="#ffb6dc" stroke-width="8"/><path d="M1135 455L1160 475L1135 495" fill="none" stroke="#ffb6dc" stroke-width="8"/><rect x="1180" y="350" width="250" height="250" rx="24" fill="#282828"/><text x="1220" y="410" fill="#ffb6dc" font-size="22" font-weight="700">03 — IA</text><text x="1220" y="475" fill="#f4f0e8" font-size="30" font-weight="700">Contexto</text><text x="1220" y="520" fill="#f4f0e8" font-size="30" font-weight="700">+ clareza</text><text x="1220" y="565" fill="#bcb6ae" font-size="20">Ser fonte.</text></g><text x="180" y="710" fill="#8f8880" font-family="Arial,sans-serif" font-size="18">RAVYT DIGITAL · CONTEÚDO, SEO E PRESENÇA DIGITAL</text></svg>